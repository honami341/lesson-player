<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lesson Player">
<title>Lesson Player</title>
<style>
:root {
  --bg: #000;
  --ink: #f7f7f4;
  --dim: rgba(247,247,244,0.54);
  --line: rgba(255,255,255,0.13);
  --glass: rgba(11,12,14,0.78);
  --glass-strong: rgba(16,17,20,0.92);
  --red: #ff453a;
  --green: #32d74b;
  --amber: #ffd166;
  --cyan: #64d2ff;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: "Helvetica Neue", "Hiragino Sans", system-ui, sans-serif;
}
button, input {
  font: inherit;
}
button {
  cursor: pointer;
}
.portrait-guard {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  align-items: center;
  justify-content: center;
  background: #000;
  text-align: center;
  padding: 28px;
}
.guard-panel {
  max-width: 360px;
}
.guard-title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 10px;
}
.guard-text {
  color: var(--dim);
  font-size: 14px;
  line-height: 1.7;
}
@media (orientation: portrait) {
  .portrait-guard { display: flex; }
  .app { display: none; }
}
.app {
  position: relative;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #000;
}
.mirror-stage {
  position: absolute;
  inset: 0;
  background: #000;
}
#liveVideo {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
#mirrorCanvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #000;
}
.camera-start {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: rgba(0,0,0,0.88);
}
.camera-start.hidden {
  display: none;
}
.start-button {
  border: 0;
  border-radius: 999px;
  background: var(--green);
  color: #031006;
  padding: 14px 38px;
  font-size: 16px;
  font-weight: 800;
}
.start-copy {
  color: var(--dim);
  font-size: 12px;
}
.error {
  min-height: 16px;
  color: #ff8b85;
  font-size: 12px;
}
.status-chip {
  position: absolute;
  top: max(12px, env(safe-area-inset-top, 0px));
  right: max(14px, env(safe-area-inset-right, 0px));
  z-index: 8;
  display: none;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.03em;
}
.status-chip.show {
  display: flex;
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--red);
}
.lesson-window {
  position: absolute;
  top: max(12px, env(safe-area-inset-top, 0px));
  left: max(12px, env(safe-area-inset-left, 0px));
  z-index: 20;
  width: clamp(330px, 42vw, 560px);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 10px;
  background: var(--glass-strong);
  box-shadow: 0 18px 50px rgba(0,0,0,0.56), 0 0 0 1px rgba(255,255,255,0.04);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.lesson-window.right {
  left: auto;
  right: max(12px, env(safe-area-inset-right, 0px));
}
.lesson-window.compact {
  width: clamp(260px, 31vw, 410px);
}
.lesson-window.large {
  width: clamp(430px, 52vw, 690px);
}
.lesson-head {
  height: 34px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
}
.lesson-title {
  flex: 1;
  min-width: 0;
  color: var(--dim);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  white-space: nowrap;
}
.btn {
  min-height: 25px;
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 6px;
  background: rgba(255,255,255,0.08);
  color: var(--ink);
  padding: 4px 9px;
  font-size: 11px;
  font-weight: 750;
  white-space: nowrap;
}
.btn:active {
  transform: scale(0.97);
}
.btn.active {
  border-color: rgba(255,69,58,0.78);
  background: rgba(255,69,58,0.24);
  color: #ff9a92;
}
.btn.go {
  border-color: var(--green);
  background: var(--green);
  color: #031006;
}
.btn.stop {
  border-color: #555;
  background: rgba(255,255,255,0.12);
}
.lesson-video {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #000;
}
#ytPlayer,
#ytPlayer iframe,
#localPlayer {
  width: 100% !important;
  height: 100% !important;
}
#localPlayer {
  display: block;
  background: #000;
  object-fit: contain;
}
.player-hidden {
  display: none !important;
}
.yt-placeholder {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 0;
  background: #060708;
  color: var(--dim);
}
.yt-placeholder.hidden {
  display: none;
}
.play-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  color: var(--red);
  font-size: 18px;
}
.placeholder-label {
  font-size: 12px;
  font-weight: 700;
}
.lesson-progress {
  height: 34px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 8px;
  border-top: 1px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.28);
}
.time {
  color: var(--dim);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.track {
  position: relative;
  flex: 1;
  min-width: 54px;
  height: 5px;
  border-radius: 4px;
  background: rgba(255,255,255,0.16);
  cursor: pointer;
}
.region,
.fill {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  border-radius: 4px;
  pointer-events: none;
}
.region {
  background: rgba(255,209,102,0.28);
}
.fill {
  width: 0%;
  background: var(--red);
}
.ab-badge {
  color: var(--dim);
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.08em;
  white-space: nowrap;
}
.ab-badge.on {
  color: var(--amber);
}
.control-rail {
  position: absolute;
  left: env(safe-area-inset-left, 0px);
  right: env(safe-area-inset-right, 0px);
  bottom: 0;
  z-index: 18;
  min-height: 54px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px max(8px, env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  background: var(--glass);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.brand {
  display: flex;
  flex-direction: column;
  min-width: 78px;
}
.brand-main {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.brand-sub {
  margin-top: 2px;
  color: var(--dim);
  font-size: 9px;
  letter-spacing: 0.08em;
}
.rail-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.delay-control {
  flex: 1;
  min-width: 160px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.rail-label {
  color: var(--dim);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: nowrap;
}
input[type="range"] {
  flex: 1;
  min-width: 80px;
  height: 4px;
  border: 0;
  border-radius: 4px;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255,255,255,0.18);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--ink);
  box-shadow: 0 2px 9px rgba(0,0,0,0.55);
}
input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border: 0;
  border-radius: 50%;
  background: var(--ink);
}
.delay-value {
  min-width: 34px;
  text-align: right;
  font-size: 14px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.modal {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.modal.open {
  display: flex;
}
.modal-box {
  width: min(440px, 92vw);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 10px;
  background: #18191d;
  padding: 17px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55);
}
.modal-title {
  margin-bottom: 12px;
  font-size: 15px;
  font-weight: 900;
}
.modal-input,
.time-input {
  width: 100%;
  border: 1px solid #383a40;
  border-radius: 7px;
  background: #24262b;
  color: var(--ink);
  outline: none;
}
.modal-input {
  padding: 11px 12px;
  font-size: 14px;
}
.modal-input:focus,
.time-input:focus {
  border-color: var(--cyan);
}
.file-pick {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  margin-top: 10px;
  border: 1px dashed rgba(255,255,255,0.24);
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  color: var(--ink);
  font-size: 13px;
  font-weight: 800;
  overflow: hidden;
}
.file-pick input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.source-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  color: rgba(247,247,244,0.36);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.source-divider::before,
.source-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.12);
}
.ab-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 11px;
}
.field label {
  display: block;
  margin-bottom: 5px;
  color: var(--dim);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.1em;
}
.time-input {
  padding: 9px 10px;
  text-align: center;
  font-size: 14px;
}
.hint {
  margin-top: 10px;
  color: rgba(247,247,244,0.42);
  font-size: 11px;
  line-height: 1.55;
}
.modal-error {
  min-height: 16px;
  margin-top: 8px;
  color: #ff8b85;
  font-size: 11px;
}
.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.modal-actions .btn {
  flex: 1;
  min-height: 34px;
}
@media (max-width: 760px) and (orientation: landscape) {
  .lesson-window {
    width: clamp(270px, 46vw, 410px);
  }
  .lesson-window.large {
    width: clamp(330px, 56vw, 500px);
  }
  .control-rail {
    gap: 7px;
    padding-left: 10px;
    padding-right: 10px;
  }
  .brand {
    min-width: 0;
  }
  .brand-sub {
    display: none;
  }
  .btn {
    padding-left: 8px;
    padding-right: 8px;
  }
}
</style>
</head>
<body>
<div class="portrait-guard">
  <div class="guard-panel">
    <div class="guard-title">iPadを横向きにしてください</div>
    <div class="guard-text">この画面は、自分の稽古映像を横長で確認するための横画面専用レイアウトです。</div>
  </div>
</div>

<div class="modal" id="settingsModal" onclick="handleModalBackdrop(event)">
  <div class="modal-box">
    <div class="modal-title">見本動画とAB区間</div>
    <input class="modal-input" id="urlInput" type="text" placeholder="YouTube URL または 動画ID">
    <div class="source-divider">or local file</div>
    <label class="file-pick">
      <span id="filePickLabel">iPad内の動画を選ぶ</span>
      <input id="fileInput" type="file" accept="video/*">
    </label>
    <div class="ab-grid">
      <div class="field">
        <label for="startTime">A 開始</label>
        <input class="time-input" id="startTime" type="text" value="0:00" placeholder="0:00">
      </div>
      <div class="field">
        <label for="endTime">B 終了</label>
        <input class="time-input" id="endTime" type="text" placeholder="終端">
      </div>
    </div>
    <div class="hint">時間は「1:30」「90」「１：３０」で入力できます。Bを空欄にすると動画の最後まで使います。</div>
    <div class="modal-error" id="ytError"></div>
    <div class="modal-actions">
      <button class="btn" type="button" onclick="closeSettings()">閉じる</button>
      <button class="btn active" type="button" onclick="loadVideo()">読み込む</button>
    </div>
  </div>
</div>

<main class="app">
  <section class="mirror-stage">
    <video id="liveVideo" autoplay playsinline muted></video>
    <canvas id="mirrorCanvas"></canvas>
    <div class="camera-start" id="cameraStart">
      <button class="start-button" type="button" onclick="toggleCamera()">カメラ開始</button>
      <div class="start-copy">遅れて映る自分の動きを、横画面いっぱいで確認します</div>
      <div class="error" id="cameraError"></div>
    </div>
  </section>

  <div class="status-chip" id="delayChip">
    <span class="status-dot"></span>
    <span id="delayChipText">10s 遅延</span>
  </div>

  <aside class="lesson-window" id="lessonWindow">
    <div class="lesson-head">
      <div class="lesson-title">Lesson Reference</div>
      <button class="btn" type="button" onclick="openSettings()">URL</button>
      <button class="btn" id="loopBtn" type="button" onclick="toggleLoop()">AB</button>
      <button class="btn" id="sizeBtn" type="button" onclick="cycleLessonSize()">小窓</button>
      <button class="btn" type="button" onclick="toggleDock()">左右</button>
    </div>
    <div class="lesson-video">
      <div id="ytPlayer"></div>
      <video id="localPlayer" class="player-hidden" controls playsinline></video>
      <button class="yt-placeholder" id="ytPlaceholder" type="button" onclick="openSettings()">
        <span class="play-mark">▶</span>
        <span class="placeholder-label">見本動画を読み込む</span>
      </button>
    </div>
    <div class="lesson-progress">
      <span class="time" id="currentTime">0:00</span>
      <div class="track" id="progressTrack" onclick="seekByProgress(event)">
        <div class="region" id="progressRegion"></div>
        <div class="fill" id="progressFill"></div>
      </div>
      <span class="time" id="durationTime">--:--</span>
      <span class="ab-badge" id="abBadge">AB</span>
    </div>
  </aside>

  <nav class="control-rail">
    <div class="brand">
      <div class="brand-main">Lesson Player</div>
      <div class="brand-sub">Mirror first</div>
    </div>
    <div class="rail-group">
      <button class="btn active" id="mirrorBtn" type="button" onclick="toggleMirror()">反転</button>
      <button class="btn" type="button" onclick="switchCamera()">カメラ</button>
      <button class="btn" id="fitBtn" type="button" onclick="toggleFitMode()">全身</button>
    </div>
    <div class="delay-control">
      <span class="rail-label">Delay</span>
      <input id="delaySlider" type="range" min="2" max="30" step="1" value="10">
      <span class="delay-value" id="delayValue">10s</span>
    </div>
    <button class="btn go" id="cameraBtn" type="button" onclick="toggleCamera()">開始</button>
  </nav>
</main>

<script>
(function() {
  var script = document.createElement('script');
  script.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(script);
})();

var ytPlayer = null;
var ytTimer = null;
var ytDuration = 0;
var ytLooping = false;
var ytSeeking = false;
var referenceMode = 'none';
var localObjectUrl = null;
var localPlayer = document.getElementById('localPlayer');

function onYouTubeIframeAPIReady() {}

function openSettings() {
  document.getElementById('settingsModal').classList.add('open');
  setTimeout(function() { document.getElementById('urlInput').focus(); }, 60);
}
function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}
function handleModalBackdrop(event) {
  if (event.target.id === 'settingsModal') closeSettings();
}
function extractVideoId(raw) {
  raw = (raw || '').trim();
  var patterns = [
    /[?&]v=([a-zA-Z0-9_-]{11})/,
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /embed\/([a-zA-Z0-9_-]{11})/,
    /^([a-zA-Z0-9_-]{11})$/
  ];
  for (var i = 0; i < patterns.length; i++) {
    var match = raw.match(patterns[i]);
    if (match) return match[1];
  }
  return null;
}
function loadVideo() {
  var videoId = extractVideoId(document.getElementById('urlInput').value);
  var error = document.getElementById('ytError');
  if (!videoId) {
    error.textContent = '有効なYouTube URLまたは動画IDを入力してください';
    return;
  }
  if (!ytPlayer && (!window.YT || !YT.Player)) {
    error.textContent = 'YouTube再生にはネット接続が必要です。オフラインではiPad内の動画を選んでください';
    return;
  }
  error.textContent = '';
  referenceMode = 'youtube';
  clearLocalVideo();
  document.getElementById('ytPlayer').classList.remove('player-hidden');
  document.getElementById('ytPlaceholder').classList.add('hidden');
  closeSettings();
  if (ytPlayer && ytPlayer.loadVideoById) {
    ytPlayer.loadVideoById(videoId);
  } else {
    ytPlayer = new YT.Player('ytPlayer', {
      videoId: videoId,
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
      events: { onReady: onYTReady, onStateChange: onYTState }
    });
  }
}
function loadLocalVideo(file) {
  if (!file) return;
  referenceMode = 'local';
  if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
  document.getElementById('ytPlayer').classList.add('player-hidden');
  document.getElementById('ytPlaceholder').classList.add('hidden');
  document.getElementById('ytError').textContent = '';
  if (localObjectUrl) URL.revokeObjectURL(localObjectUrl);
  localObjectUrl = URL.createObjectURL(file);
  localPlayer.src = localObjectUrl;
  localPlayer.classList.remove('player-hidden');
  document.getElementById('filePickLabel').textContent = file.name;
  closeSettings();
  localPlayer.load();
  localPlayer.play().catch(function() {});
  startYTMonitor();
}
function clearLocalVideo() {
  localPlayer.pause();
  localPlayer.removeAttribute('src');
  localPlayer.load();
  localPlayer.classList.add('player-hidden');
  if (localObjectUrl) {
    URL.revokeObjectURL(localObjectUrl);
    localObjectUrl = null;
  }
}
function onYTReady() {
  refreshDuration();
  startYTMonitor();
}
function onYTState(event) {
  if (event.data === YT.PlayerState.PLAYING) {
    refreshDuration();
    ytSeeking = false;
  } else if (event.data === YT.PlayerState.ENDED && ytLooping) {
    seekLoopStart();
  }
}
function refreshDuration() {
  ytDuration = getReferenceDuration() || ytDuration;
  document.getElementById('durationTime').textContent = ytDuration ? formatTime(ytDuration) : '--:--';
  updateRegion();
}
function toggleLoop() {
  ytLooping = !ytLooping;
  document.getElementById('loopBtn').classList.toggle('active', ytLooping);
  document.getElementById('abBadge').classList.toggle('on', ytLooping);
  document.getElementById('loopBtn').textContent = ytLooping ? 'AB ON' : 'AB';
  document.getElementById('abBadge').textContent = ytLooping ? 'AB ON' : 'AB';
  if (ytLooping && hasReference()) {
    startYTMonitor();
    seekLoopStart();
  }
  updateRegion();
}
function startYTMonitor() {
  if (ytTimer) clearInterval(ytTimer);
  ytTimer = setInterval(function() {
    if (!hasReference()) return;
    refreshDuration();
    var current = getReferenceCurrentTime();
    if (current === null) return;
    document.getElementById('currentTime').textContent = formatTime(current);
    if (ytDuration > 0) {
      document.getElementById('progressFill').style.width = clamp(current / ytDuration * 100, 0, 100) + '%';
    }
    if (ytLooping) enforceLoop(current);
  }, 200);
}
function getLoopRange() {
  var start = parseTime(document.getElementById('startTime').value);
  var endRaw = document.getElementById('endTime').value.trim();
  var end = endRaw ? parseTime(endRaw) : ytDuration;
  if (!isFinite(start) || start < 0) start = 0;
  if (!isFinite(end) || end <= 0 || end > ytDuration) end = ytDuration;
  return { start: start, end: end, valid: ytDuration > 0 && start < end };
}
function enforceLoop(current) {
  if (ytSeeking) return;
  var range = getLoopRange();
  if (!range.valid) return;
  if (current >= range.end - 0.28 || current < range.start - 0.5) {
    seekLoopStart();
  }
}
function seekLoopStart() {
  if (!hasReference()) return;
  var range = getLoopRange();
  if (!range.valid) return;
  ytSeeking = true;
  seekReference(range.start);
  playReference();
  setTimeout(function() { ytSeeking = false; }, 900);
}
function seekByProgress(event) {
  if (!hasReference() || !ytDuration) return;
  var rect = document.getElementById('progressTrack').getBoundingClientRect();
  var ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
  seekReference(ratio * ytDuration);
}
function updateRegion() {
  var region = document.getElementById('progressRegion');
  if (!ytDuration) {
    region.style.left = '0%';
    region.style.width = '0%';
    return;
  }
  var range = getLoopRange();
  region.style.left = clamp(range.start / ytDuration * 100, 0, 100) + '%';
  region.style.width = clamp((range.end - range.start) / ytDuration * 100, 0, 100) + '%';
}
['startTime', 'endTime'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', updateRegion);
});
document.getElementById('urlInput').addEventListener('keydown', function(event) {
  if (event.key === 'Enter') loadVideo();
});
document.getElementById('fileInput').addEventListener('change', function(event) {
  loadLocalVideo(event.target.files && event.target.files[0]);
  event.target.value = '';
});
localPlayer.addEventListener('loadedmetadata', function() {
  ytDuration = localPlayer.duration || 0;
  refreshDuration();
  updateRegion();
});
localPlayer.addEventListener('ended', function() {
  if (ytLooping) seekLoopStart();
});
localPlayer.addEventListener('play', function() {
  referenceMode = 'local';
  startYTMonitor();
});
function hasReference() {
  if (referenceMode === 'local') return !!localPlayer.src;
  if (referenceMode === 'youtube') return !!(ytPlayer && typeof ytPlayer.getCurrentTime === 'function');
  return false;
}
function getReferenceDuration() {
  if (referenceMode === 'local') return isFinite(localPlayer.duration) ? localPlayer.duration : 0;
  if (referenceMode === 'youtube' && ytPlayer && ytPlayer.getDuration) return ytPlayer.getDuration() || 0;
  return 0;
}
function getReferenceCurrentTime() {
  if (referenceMode === 'local') return localPlayer.currentTime || 0;
  if (referenceMode === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) return ytPlayer.getCurrentTime();
  return null;
}
function seekReference(seconds) {
  if (referenceMode === 'local') {
    localPlayer.currentTime = seconds;
  } else if (referenceMode === 'youtube' && ytPlayer && ytPlayer.seekTo) {
    ytPlayer.seekTo(seconds, true);
  }
}
function playReference() {
  if (referenceMode === 'local') {
    localPlayer.play().catch(function() {});
  } else if (referenceMode === 'youtube' && ytPlayer && ytPlayer.playVideo) {
    ytPlayer.playVideo();
  }
}

var sizeMode = 1;
function cycleLessonSize() {
  var win = document.getElementById('lessonWindow');
  var btn = document.getElementById('sizeBtn');
  sizeMode = (sizeMode + 1) % 3;
  win.classList.toggle('compact', sizeMode === 0);
  win.classList.toggle('large', sizeMode === 2);
  btn.textContent = sizeMode === 0 ? '小' : sizeMode === 1 ? '小窓' : '大';
}
function toggleDock() {
  document.getElementById('lessonWindow').classList.toggle('right');
}

var cameraStream = null;
var cameraRunning = false;
var captureTimer = null;
var drawRaf = null;
var frameBuffer = [];
var delaySeconds = 10;
var mirrored = true;
var facingMode = 'user';
var fitMode = 'contain';
var captureMs = 80;

var liveVideo = document.getElementById('liveVideo');
var mirrorCanvas = document.getElementById('mirrorCanvas');
var mirrorCtx = mirrorCanvas.getContext('2d');
var captureCanvas = document.createElement('canvas');
var captureCtx = captureCanvas.getContext('2d');

function resizeMirror() {
  var rect = mirrorCanvas.getBoundingClientRect();
  var scale = window.devicePixelRatio || 1;
  mirrorCanvas.width = Math.max(1, Math.round(rect.width * scale));
  mirrorCanvas.height = Math.max(1, Math.round(rect.height * scale));
}
window.addEventListener('resize', resizeMirror);
resizeMirror();

function toggleCamera() {
  cameraRunning ? stopCamera() : startCamera();
}
async function startCamera() {
  document.getElementById('cameraError').textContent = '';
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    liveVideo.srcObject = cameraStream;
    await liveVideo.play();
    frameBuffer = [];
    resizeMirror();
    captureTimer = setInterval(captureFrame, captureMs);
    drawRaf = requestAnimationFrame(drawLoop);
    cameraRunning = true;
    document.getElementById('cameraStart').classList.add('hidden');
    document.getElementById('delayChip').classList.add('show');
    var btn = document.getElementById('cameraBtn');
    btn.textContent = '停止';
    btn.className = 'btn stop';
  } catch (error) {
    var message = 'カメラを起動できませんでした';
    if (error.name === 'NotAllowedError') message = 'カメラの許可が必要です';
    if (error.name === 'NotFoundError') message = 'カメラが見つかりません';
    document.getElementById('cameraError').textContent = message;
  }
}
function stopCamera() {
  cameraRunning = false;
  if (captureTimer) {
    clearInterval(captureTimer);
    captureTimer = null;
  }
  if (drawRaf) {
    cancelAnimationFrame(drawRaf);
    drawRaf = null;
  }
  if (cameraStream) {
    cameraStream.getTracks().forEach(function(track) { track.stop(); });
    cameraStream = null;
  }
  liveVideo.srcObject = null;
  frameBuffer = [];
  mirrorCtx.clearRect(0, 0, mirrorCanvas.width, mirrorCanvas.height);
  document.getElementById('cameraStart').classList.remove('hidden');
  document.getElementById('delayChip').classList.remove('show');
  var btn = document.getElementById('cameraBtn');
  btn.textContent = '開始';
  btn.className = 'btn go';
}
function switchCamera() {
  if (!cameraRunning) return;
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  stopCamera();
  startCamera();
}
function toggleMirror() {
  mirrored = !mirrored;
  var btn = document.getElementById('mirrorBtn');
  btn.classList.toggle('active', mirrored);
  btn.textContent = mirrored ? '反転' : '反転OFF';
}
function toggleFitMode() {
  fitMode = fitMode === 'contain' ? 'cover' : 'contain';
  document.getElementById('fitBtn').textContent = fitMode === 'contain' ? '全身' : '拡大';
}
function captureFrame() {
  if (!cameraRunning) return;
  var vw = liveVideo.videoWidth;
  var vh = liveVideo.videoHeight;
  if (!vw || !vh) return;
  var maxDim = 560;
  if (vw >= vh) {
    captureCanvas.width = maxDim;
    captureCanvas.height = Math.round(maxDim * vh / vw);
  } else {
    captureCanvas.height = maxDim;
    captureCanvas.width = Math.round(maxDim * vw / vh);
  }
  captureCtx.drawImage(liveVideo, 0, 0, captureCanvas.width, captureCanvas.height);
  var img = new Image();
  img.src = captureCanvas.toDataURL('image/jpeg', 0.68);
  frameBuffer.push({ t: Date.now(), img: img });
  var cutoff = Date.now() - (delaySeconds + 6) * 1000;
  while (frameBuffer.length && frameBuffer[0].t < cutoff) frameBuffer.shift();
}
function drawLoop() {
  drawRaf = requestAnimationFrame(drawLoop);
  if (!cameraRunning || !frameBuffer.length) return;
  var target = Date.now() - delaySeconds * 1000;
  var frame = frameBuffer[0];
  for (var i = frameBuffer.length - 1; i >= 0; i--) {
    if (frameBuffer[i].t <= target) {
      frame = frameBuffer[i];
      break;
    }
  }
  if (!frame || !frame.img.complete || !frame.img.naturalWidth) return;
  var cw = mirrorCanvas.width;
  var ch = mirrorCanvas.height;
  var fw = frame.img.naturalWidth;
  var fh = frame.img.naturalHeight;
  var containScale = Math.min(cw / fw, ch / fh);
  var coverScale = Math.max(cw / fw, ch / fh);
  var scale = fitMode === 'cover' ? coverScale : containScale;
  mirrorCtx.clearRect(0, 0, cw, ch);
  mirrorCtx.save();
  mirrorCtx.translate(cw / 2, ch / 2);
  if (mirrored) mirrorCtx.scale(-1, 1);
  mirrorCtx.drawImage(frame.img, -fw * scale / 2, -fh * scale / 2, fw * scale, fh * scale);
  mirrorCtx.restore();
}
document.getElementById('delaySlider').addEventListener('input', function(event) {
  delaySeconds = parseInt(event.target.value, 10);
  document.getElementById('delayValue').textContent = delaySeconds + 's';
  document.getElementById('delayChipText').textContent = delaySeconds + 's 遅延';
});
window.addEventListener('beforeunload', stopCamera);

function parseTime(value) {
  if (!value) return 0;
  value = normalizeTimeInput(value);
  if (/^\d+(\.\d+)?$/.test(value)) return parseFloat(value);
  var parts = value.split(':').map(Number);
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return 0;
}
function normalizeTimeInput(value) {
  return String(value).trim()
    .replace(/[０-９]/g, function(ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
    })
    .replace(/[：]/g, ':')
    .replace(/[．]/g, '.');
}
function formatTime(sec) {
  sec = Math.floor(sec || 0);
  var h = Math.floor(sec / 3600);
  var m = Math.floor((sec % 3600) / 60);
  var s = sec % 60;
  return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
}
function pad(num) {
  return num < 10 ? '0' + num : '' + num;
}
function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function() {});
  });
}
